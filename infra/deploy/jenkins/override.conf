# ==========================================================================
# Jenkins(apt 설치, systemd) 실행 옵션 덮어쓰기
#   → 서버 /etc/systemd/system/jenkins.service.d/override.conf
# 적용: sudo systemctl daemon-reload && sudo systemctl restart jenkins
#
# - 8080은 backend가 쓰므로 Jenkins는 9090으로 옮긴다 (02 문서 D10 → A안).
# - 127.0.0.1에서만 받는다. 밖에서는 Nginx의 https://k15b201.p.ssafy.io/jenkins/ 로만 들어온다.
# - 주소 앞부분(/jenkins)은 Nginx location, Jenkins URL 설정과 세 곳이 같아야 한다.
# - 힙 메모리 상한 1GB (기본값은 서버 메모리의 1/4 ≈ 3.7GB). 부족하면 1536m로 올린다.
# ==========================================================================
[Service]
Environment="JENKINS_PORT=9090"
Environment="JENKINS_LISTEN_ADDRESS=127.0.0.1"
Environment="JENKINS_PREFIX=/jenkins"
Environment="JAVA_OPTS=-Djava.awt.headless=true -Xmx1g"
