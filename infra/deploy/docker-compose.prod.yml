# ==========================================================================
# 운영(EC2) Compose → 서버 /srv/eumi/docker-compose.prod.yml
#   원본은 저장소의 이 파일이다. 서버 사본은 infra/scripts/sync.sh가 배포마다 덮어쓴다.
#
# 직접 up/down 하지 않고 스크립트로만 실행한다 (모두 jenkins 계정으로):
#   scripts/migrate.sh               → postgres · mailpit 기동, 백업, Flyway
#   scripts/deploy.sh <서비스> <태그> → 서비스 하나 교체 + 헬스체크 (실패하면 이전 태그로 되돌림)
#   scripts/grafana.sh               → Grafana 띄우기 · 설정 다시 읽기 (공식 이미지라 태그가 없다)
#   scripts/dc.sh <compose 명령>      → 상태 보기 (ps, logs 등)
#
# 값을 읽는 곳
#   .env.config  비밀값 (서버에서 만든 무작위 값, 권한 600)
#   .env.tags    서비스별 배포 태그 (deploy.sh가 갱신)
#
# 지키는 규칙
#   - 인터넷에 열리는 포트는 없다. 호스트 Nginx가 받는 web · backend · pipeline-web(Airflow) · grafana와 mailpit 화면만 127.0.0.1에 묶는다.
#     Docker는 UFW를 거치지 않으므로 "8080:8080"이나 "0.0.0.0:..." 형태는 절대 쓰지 않는다.
#   - DB 데이터 볼륨(eumi-pgdata)과 원본 저장소 볼륨(eumi-miniodata)은 external이다. "docker compose down -v"를 실행해도 지워지지 않는다.
#   - 서비스마다 컨테이너가 쓸 메모리 상한(mem_limit)과 로그 크기 상한을 둔다.
# ==========================================================================
name: eumi

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 데이터 파이프라인 컨테이너 3개(pipeline-init · pipeline · pipeline-web)가 함께 쓰는 환경.
#   변수에 :?를 쓰지 않는다 (ai와 같은 이유: profile 서비스라도 :? 값이 비면 backend 배포까지 모든 compose 명령이 멈춘다).
#   빈 값 검사는 deploy.sh pipeline이 한다.
x-pipeline-env: &pipeline-env
  # MinIO (S3A · s3fs). 루트 계정을 그대로 접근 키로 쓴다
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: sgi
  KAFKA_BOOTSTRAP: kafka:19092
  KAFKA_TOPIC_FLOW: flow_hourly
  # 결과 DB (eumi_pipeline 계정)
  PIPELINE_DB_URL: jdbc:postgresql://postgres:5432/eumi
  PIPELINE_DB_USER: eumi_pipeline
  PIPELINE_DB_PASSWORD: ${EUMI_PIPELINE_PASSWORD:-}
  PIPELINE_DB_DSN: postgresql://eumi_pipeline:${EUMI_PIPELINE_PASSWORD:-}@postgres:5432/eumi
  # 수집 API 키 · 모델 버전
  DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
  KAKAO_REST_KEY: ${KAKAO_REST_KEY:-}
  MODEL_VERSION: v20261102
  TZ: Asia/Seoul
  # Airflow (메타 DB는 postgres의 airflow DB, 태스크는 pipeline 컨테이너 안에서 LocalExecutor로)
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-}@postgres:5432/airflow
  AIRFLOW__CORE__DAGS_FOLDER: /opt/eumi/data/airflow/dags
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-}
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
  AIRFLOW__WEBSERVER__BASE_URL: https://k15b201.p.ssafy.io/airflow
  AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "true"
  AIRFLOW__WEBSERVER__WORKERS: "2"     # 화면을 보는 사람이 적다. 기본 4개면 pipeline-web 메모리 상한(1g)에 가깝다
  AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "60"
  AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs

x-pipeline-volumes: &pipeline-volumes
  - ./data:/opt/eumi/data
  - sparkcheckpoint:/opt/eumi/checkpoint
  - airflowlogs:/opt/airflow/logs

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      # 슈퍼유저(postgres)는 계정 생성 · 백업에만 쓴다. 앱은 아래 계정 4개를 쓴다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env.config에 POSTGRES_PASSWORD가 필요합니다}
      EUMI_OWNER_PASSWORD: ${EUMI_OWNER_PASSWORD:?.env.config에 EUMI_OWNER_PASSWORD가 필요합니다}
      EUMI_APP_PASSWORD: ${EUMI_APP_PASSWORD:?.env.config에 EUMI_APP_PASSWORD가 필요합니다}
      EUMI_PIPELINE_PASSWORD: ${EUMI_PIPELINE_PASSWORD:?.env.config에 EUMI_PIPELINE_PASSWORD가 필요합니다}
      EUMI_AI_PASSWORD: ${EUMI_AI_PASSWORD:?.env.config에 EUMI_AI_PASSWORD가 필요합니다}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 볼륨이 비어 있을 때(처음 한 번)만 실행: 계정 4개 + eumi DB 생성 (로컬과 같은 파일)
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ./db/roles:/eumi/roles:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d eumi"]
      interval: 5s
      timeout: 3s
      retries: 30
    shm_size: 256m
    mem_limit: 2g
    logging: *logging
    # ports 없음 — DB를 직접 봐야 하면 서버에서 scripts/dc.sh exec postgres psql ... 로 들어간다

  # 평소에는 뜨지 않는다. scripts/migrate.sh가 "run --rm flyway migrate"로 실행한다.
  flyway:
    image: flyway/flyway:13.11.1
    profiles: ["tools"]
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/eumi
      FLYWAY_USER: eumi_owner
      FLYWAY_PASSWORD: ${EUMI_OWNER_PASSWORD:?.env.config에 EUMI_OWNER_PASSWORD가 필요합니다}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql,filesystem:/flyway/seed
      FLYWAY_CLEAN_DISABLED: "true"              # flyway clean(전체 삭제) 명령 차단
      FLYWAY_GROUP: "true"                       # 새 파일 여러 개를 한 트랜잭션으로: 하나라도 실패하면 전부 되돌림
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"   # 이름 규칙이 틀린 파일을 조용히 건너뛰지 않고 실패시킨다
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./db/migration:/flyway/sql:ro
      # 개발·시연용 seed (db/seed/R__*.sql, ON CONFLICT DO NOTHING). 로컬과 같은 파일을 운영에도 넣는다
      - ./db/seed:/flyway/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  backend:
    image: eumi-backend:${BACKEND_TAG:?.env.tags에 BACKEND_TAG가 필요합니다}
    restart: unless-stopped
    # env_file을 쓰지 않는다: backend에는 자기 계정(eumi_app) 비밀번호, 해시 키, 내부 연동 토큰만 넘긴다.
    # BE가 새 설정 키를 정하면 여기에 "이름: ${이름:?...}" 한 줄, .env.config에 값 한 줄을 추가한다.
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/eumi
      DB_USERNAME: eumi_app
      DB_PASSWORD: ${EUMI_APP_PASSWORD:?.env.config에 EUMI_APP_PASSWORD가 필요합니다}
      UPLOAD_DIR: /data/uploads
      # 메일: 지금은 같은 compose의 mailpit으로 보낸다 (밖으로 나가지 않음).
      #   실제 SMTP를 정하면 아래 4줄을 바꾸고, 계정(SMTP_USERNAME · SMTP_PASSWORD)은 .env.config로 넘긴다
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_AUTH: "false"
      SMTP_STARTTLS_ENABLED: "false"
      EUMI_MAIL_FROM: no-reply@k15b201.p.ssafy.io
      # 인증 코드 · 가입 증명 해시 키 (비밀값. 서버에서 한 번 만들고 바꾸지 않는다)
      EUMI_AUTH_HASH_KEY: ${EUMI_AUTH_HASH_KEY:?.env.config에 EUMI_AUTH_HASH_KEY가 필요합니다}
      # 내부 연동 토큰 (비밀값, 호출자마다 다른 값. BE 설정 eumi.internal.ai-token · pipeline-token)
      #   EUMI_AI_TOKEN: AI → backend 알림(INT-07 · 08). ai의 SETTINGS_BACKEND_TOKEN과 같은 값이다 (아래 ai environment)
      #   EUMI_PIPELINE_TOKEN: 파이프라인 → backend 월 분석 완료 알림(INT-04). 지금 DAG는 INT-04를 부르지 않아 Airflow에는 넘기지 않는다
      #   두 값이 같거나 공백 · 제어 문자 · "${"가 들어 있으면 backend가 뜨지 않는다.
      #   http 모드는 둘 다 있어야 backend가 뜬다. 값이 없으면 compose가 여기서 멈춘다
      EUMI_AI_TOKEN: ${EUMI_AI_TOKEN:?.env.config에 EUMI_AI_TOKEN이 필요합니다}
      EUMI_PIPELINE_TOKEN: ${EUMI_PIPELINE_TOKEN:?.env.config에 EUMI_PIPELINE_TOKEN이 필요합니다}
      # AI 실행 방식: http(ai 서비스 호출, 11/11 전환) / fake(가짜 AI가 진행·완료 행을 씀). 비밀값이 아니라 여기 둔다.
      #   application-prod.yml이 기본값 없이 읽으므로 빠지면 backend가 뜨지 않는다.
      #   fake로 되돌릴 때: 이 줄만 fake로 바꾸는 커밋을 master에 넣는다 (시간 값 · 토큰은 그대로 둬도 뜬다). infra/README "AI 서버 (ai)"
      EUMI_AI_MODE: http
      # AI 시간 값 4개 (docs/api/ai-agent-panel.md 5절). ai의 runtime_timeout 300초 · llm_timeout 30초 기준
      #   실행 제한 = 300초 + 마무리, 여유 = 실패 행 커밋 대기, 무응답 = llm_timeout + 여유(넘으면 INT-01을 한 번 다시 보냄), 취소 대기 = 취소 행 커밋 대기
      EUMI_AI_EXECUTION_LIMIT: 330s
      EUMI_AI_GRACE_PERIOD: 5s
      EUMI_AI_UNRESPONSIVE_AFTER: 40s
      EUMI_AI_CANCEL_WAIT: 3s
      # ai 서비스 주소 (같은 compose 내부망)
      AI_BASE_URL: http://ai:8000
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g
    logging: *logging

  web:
    image: eumi-web:${WEB_TAG:?.env.tags에 WEB_TAG가 필요합니다}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    mem_limit: 256m
    logging: *logging

  # 임시 메일 서버: 밖으로 메일을 보내지 않고 모아 둔다. 실제 SMTP를 정하면 교체한다.
  # 메일함 화면은 인증이 없으므로 127.0.0.1에만 연다. 볼 때는 PC에서 SSH 터널:
  #   ssh -i C:/keys/eumi.pem -L 8025:127.0.0.1:8025 ubuntu@k15b201.p.ssafy.io → http://localhost:8025
  # backend는 컨테이너 사이 주소 mailpit:1025 로 보낸다 (호스트 포트 불필요).
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    mem_limit: 256m
    logging: *logging

  # AI 서버 (FastAPI, ai/Dockerfile은 AI 담당 관리, 헬스체크 GET /health). backend만 내부망 http://ai:8000 으로 부른다
  #   - ports 없음, Nginx 경로 없음 → 바깥에서 닿지 않는다. 밖으로 나가는 연결은 LLM API뿐이다.
  #   - profile "ai": 첫 배포 전(AI_TAG 없음)에는 뜨지 않는다. deploy.sh ai <태그>가 이름으로 띄운다.
  #   - 변수에 :?를 쓰지 않는다. profile 서비스라도 :? 값이 비면 모든 compose 명령(backend 배포 포함)이 멈추기 때문이다.
  #     빈 값 검사는 deploy.sh ai가 한다.
  #   - 실행 중인 대화를 메모리에 두므로 컨테이너 1개 · worker 1개로만 띄운다.
  ai:
    image: eumi-ai:${AI_TAG:-none}
    profiles: ["ai"]
    restart: unless-stopped
    # env_file을 쓰지 않는다: ai에는 자기 계정(eumi_ai) 비밀번호, LLM 키, AI 토큰만 넘긴다.
    # 키 이름(SETTINGS_*)은 ai/src/settings.py가 읽는 이름이다.
    environment:
      SETTINGS_API_KEY: ${EUMI_LLM_API_KEY:-}
      SETTINGS_DATABASE_URL: postgresql://eumi_ai:${EUMI_AI_PASSWORD:-}@postgres:5432/eumi
      # AI → backend 알림(INT-07 행 저장 · INT-08 보고서 완료) 주소와 Bearer 토큰. 둘 다 없으면 ai가 시작되지 않는다.
      #   토큰은 backend environment의 EUMI_AI_TOKEN과 같은 키(같은 값)다. backend가 받지 못하는 알림(INT-08은 AI-b 전)은
      #   실패로만 남고, 저장된 행 · 보고서는 그대로다
      SETTINGS_BACKEND_URL: http://backend:8080
      SETTINGS_BACKEND_TOKEN: ${EUMI_AI_TOKEN:-}
      SETTINGS_OUTPUT_DIR: /app/outputs
      # LLM 주소 · 모델 (비밀값 아님). SSAFY GMS의 OpenAI 호환 주소다 (ai가 뒤에 /responses를 붙여 Responses API로 부른다).
      #   11/11 로컬에서 gpt-6-luna로 패널 질문 · 도구 선택(strict JSON) · 화면 문맥 · 중단을 확인했다.
      #   빈 값이면 ai가 시작되지 않는다(주소 형식 검사)
      SETTINGS_BASE_URL: https://gms.ssafy.io/gmsapi/api.openai.com/v1
      SETTINGS_MODEL: gpt-6-luna
      LANGFUSE_ENABLED: "false"
      TZ: Asia/Seoul
    # 실행 기록(질문 · 모델 입출력 추적)은 디스크에 남기지 않는다. 메모리 512MB 안에서만 쓰고 컨테이너를 바꾸면 지워진다
    tmpfs:
      - /app/outputs:size=512m,uid=10001
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g
    logging: *logging

  # ========== 데이터 파이프라인 (MinIO · Kafka · pipeline = Spark + Airflow) + 모니터링 (Grafana) ==========
  # 로컬 infra/docker-compose.yml의 data 프로필과 같은 구성이다. 모든 배치 · 스트리밍 스크립트는 pipeline 컨테이너 안에서 돈다.
  #   - profile "pipeline": 첫 배포 전에는 뜨지 않는다. deploy.sh pipeline <태그>와 grafana.sh가 이름으로 띄운다.
  #   - 저장소 data/pipeline · data/airflow는 sync.sh가 /srv/eumi/data로 복사해 마운트한다 (이미지를 다시 빌드하지 않고 스크립트 · DAG 갱신).
  #   - 원본 파일 · 가상 유동 · 모델 자산은 MinIO 볼륨(eumi-miniodata)에 있다.
  #   - 서버 구성 절차와 지킬 것(과거 달 배치를 다시 돌리지 않는다)은 infra/README.md "데이터 파이프라인 · Grafana (운영)".

  # 원본 저장소 (S3 호환). 버킷 sgi. 포트를 열지 않는다 — 컨테이너 사이 주소 minio:9000만 쓴다
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    profiles: ["pipeline"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_DEFAULT_BUCKETS: sgi
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    logging: *logging

  # 메시지 큐 (KRaft 단일 노드). 스트리밍 시연용. 컨테이너 사이 주소 kafka:19092, 보관 7일
  kafka:
    image: apache/kafka:3.9.2
    profiles: ["pipeline"]
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # 토픽은 kafka-init이 만든다
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms512m"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 1536m
    logging: *logging

  # 토픽 flow_hourly를 만들고 끝난다 (deploy.sh pipeline이 배포마다 한 번 실행, 이미 있으면 넘어감)
  kafka-init:
    image: apache/kafka:3.9.2
    profiles: ["pipeline"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic flow_hourly --partitions 6 --replication-factor 1
    logging: *logging

  # Airflow 메타 DB 마이그레이션 + 관리자 계정 + Grafana 계정 읽기 권한 (deploy.sh pipeline이 배포마다 한 번 실행. 다시 실행해도 안전)
  #   관리자 비밀번호는 명령줄에 펼치지 않고 컨테이너 환경변수로 넘긴다 ($$ = compose가 아니라 컨테이너 셸이 읽는다)
  pipeline-init:
    image: eumi-pipeline:${PIPELINE_TAG:-none}
    profiles: ["pipeline"]
    environment:
      <<: *pipeline-env
      EUMI_AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-}
      EUMI_AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    volumes: *pipeline-volumes
    working_dir: /opt/eumi/data
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        airflow db migrate
        airflow users create --username "$$EUMI_AIRFLOW_ADMIN_USER" --password "$$EUMI_AIRFLOW_ADMIN_PASSWORD" --firstname Eumi --lastname Admin --role Admin --email admin@eumi.local || true
        python3 airflow/grant_monitor.py
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # Airflow 스케줄러 = 월 배치 실행기. Spark 드라이버(4g)가 이 안에서 뜬다
  #   헬스체크는 airflow 명령을 새로 띄워 CPU를 쓰므로 60초에 한 번만 본다
  pipeline:
    image: eumi-pipeline:${PIPELINE_TAG:-none}
    profiles: ["pipeline"]
    restart: unless-stopped
    environment: *pipeline-env
    volumes: *pipeline-volumes
    working_dir: /opt/eumi/data
    command: ["airflow", "scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 6g
    logging: *logging

  # Airflow 웹 화면 → Nginx /airflow/ (로그인 필요). 127.0.0.1에만 연다
  #   BASE_URL에 /airflow가 있어 헬스 주소도 /airflow/health다 (경로 없는 /health는 404)
  pipeline-web:
    image: eumi-pipeline:${PIPELINE_TAG:-none}
    profiles: ["pipeline"]
    restart: unless-stopped
    environment: *pipeline-env
    volumes: *pipeline-volumes
    ports:
      - "127.0.0.1:8081:8080"
    command: ["airflow", "webserver"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/airflow/health >/dev/null || curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    logging: *logging

  # 파이프라인 모니터링: 대시보드 2개 + Mattermost 알림 8종. 설정은 전부 ./grafana/provisioning의 파일이다 (sync.sh가 복사)
  #   - 호스트 3000은 web이 쓰므로 3001에 묶는다. 밖에서는 Nginx /grafana/로만 들어온다 (로그인 필요)
  #   - DB는 읽기 전용 계정 eumi_monitor로 읽는다 (eumi DB 결과 테이블 + airflow DB 실행 이력)
  #   - 관리자 비밀번호가 비면 Grafana 기본값(admin)으로 뜬다. 그래서 grafana.sh가 값이 있을 때만 띄운다 (직접 up 하지 않는다)
  #   - 웹훅(MATTERMOST_WEBHOOK_URL)은 없어도 된다. 없으면 닿지 않는 주소로 보내다 실패하고 끝난다 (알림만 안 감)
  grafana:
    image: grafana/grafana-oss:12.4.3
    profiles: ["pipeline"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Seoul
      # Nginx 하위 경로. 알림 메시지의 "대시보드 열기" 링크도 이 주소로 만들어진다
      GF_SERVER_ROOT_URL: https://k15b201.p.ssafy.io/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # provisioning/datasources/eumi.yml이 읽는 값
      EUMI_MONITOR_PASSWORD: ${EUMI_MONITOR_PASSWORD:-}
      # provisioning/alerting/contact-points.yml이 읽는 값
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL:-http://127.0.0.1:9/eumi-alert-webhook-not-set}
      EUMI_ALERT_ENV: 운영
      EUMI_AIRFLOW_URL: https://k15b201.p.ssafy.io/airflow/
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/grafana/api/health >/dev/null 2>&1 || wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    logging: *logging

volumes:
  pgdata:
    external: true      # 04 문서에서 "docker volume create eumi-pgdata"로 직접 만든다
    name: eumi-pgdata
  uploads:
    name: eumi-uploads
  miniodata:
    external: true      # 원본 · 가상 유동 · 모델 자산. "docker volume create eumi-miniodata"로 직접 만든다 (down -v에도 남게)
    name: eumi-miniodata
  kafkadata:
    name: eumi-kafkadata
  sparkcheckpoint:
    name: eumi-sparkcheckpoint
  airflowlogs:
    name: eumi-airflowlogs
  grafanadata:
    name: eumi-grafanadata      # 알림 상태 · 보낸 기록. 지워져도 설정은 파일에서 다시 만들어진다
