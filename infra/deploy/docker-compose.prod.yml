# ==========================================================================
# 운영(EC2) Compose → 서버 /srv/eumi/docker-compose.prod.yml
#   원본은 저장소의 이 파일이다. 서버 사본은 infra/scripts/sync.sh가 배포마다 덮어쓴다.
#
# 직접 up/down 하지 않고 스크립트로만 실행한다 (모두 jenkins 계정으로):
#   scripts/migrate.sh               → postgres · mailpit 기동, 백업, Flyway
#   scripts/deploy.sh <서비스> <태그> → 서비스 하나 교체 + 헬스체크 (실패하면 이전 태그로 되돌림)
#   scripts/dc.sh <compose 명령>      → 상태 보기 (ps, logs 등)
#
# 값을 읽는 곳
#   .env.config  비밀값 (서버에서 만든 무작위 값, 권한 600)
#   .env.tags    서비스별 배포 태그 (deploy.sh가 갱신)
#
# 지키는 규칙
#   - 인터넷에 열리는 포트는 없다. 호스트 Nginx가 받는 web · backend · pipeline-web(Airflow)과 mailpit 화면만 127.0.0.1에 묶는다.
#     Docker는 UFW를 거치지 않으므로 "8080:8080"이나 "0.0.0.0:..." 형태는 절대 쓰지 않는다.
#   - DB 데이터 볼륨(eumi-pgdata)은 external이다. "docker compose down -v"를 실행해도 지워지지 않는다.
#   - 서비스마다 컨테이너가 쓸 메모리 상한(mem_limit)과 로그 크기 상한을 둔다.
# ==========================================================================
name: eumi

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      # 슈퍼유저(postgres)는 계정 생성 · 백업에만 쓴다. 앱은 아래 계정 4개를 쓴다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env.config에 POSTGRES_PASSWORD가 필요합니다}
      EUMI_OWNER_PASSWORD: ${EUMI_OWNER_PASSWORD:?.env.config에 EUMI_OWNER_PASSWORD가 필요합니다}
      EUMI_APP_PASSWORD: ${EUMI_APP_PASSWORD:?.env.config에 EUMI_APP_PASSWORD가 필요합니다}
      EUMI_PIPELINE_PASSWORD: ${EUMI_PIPELINE_PASSWORD:?.env.config에 EUMI_PIPELINE_PASSWORD가 필요합니다}
      EUMI_AI_PASSWORD: ${EUMI_AI_PASSWORD:?.env.config에 EUMI_AI_PASSWORD가 필요합니다}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 볼륨이 비어 있을 때(처음 한 번)만 실행: 계정 4개 + eumi DB 생성 (로컬과 같은 파일)
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ./db/roles:/eumi/roles:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d eumi"]
      interval: 5s
      timeout: 3s
      retries: 30
    shm_size: 256m
    mem_limit: 2g
    logging: *logging
    # ports 없음 — DB를 직접 봐야 하면 서버에서 scripts/dc.sh exec postgres psql ... 로 들어간다

  # 평소에는 뜨지 않는다. scripts/migrate.sh가 "run --rm flyway migrate"로 실행한다.
  flyway:
    image: flyway/flyway:13.11.1
    profiles: ["tools"]
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/eumi
      FLYWAY_USER: eumi_owner
      FLYWAY_PASSWORD: ${EUMI_OWNER_PASSWORD:?.env.config에 EUMI_OWNER_PASSWORD가 필요합니다}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql,filesystem:/flyway/seed
      FLYWAY_CLEAN_DISABLED: "true"              # flyway clean(전체 삭제) 명령 차단
      FLYWAY_GROUP: "true"                       # 새 파일 여러 개를 한 트랜잭션으로: 하나라도 실패하면 전부 되돌림
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"   # 이름 규칙이 틀린 파일을 조용히 건너뛰지 않고 실패시킨다
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./db/migration:/flyway/sql:ro
      # 개발·시연용 seed (db/seed/R__*.sql, ON CONFLICT DO NOTHING). 로컬과 같은 파일을 운영에도 넣는다
      - ./db/seed:/flyway/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  backend:
    image: eumi-backend:${BACKEND_TAG:?.env.tags에 BACKEND_TAG가 필요합니다}
    restart: unless-stopped
    # env_file을 쓰지 않는다: backend에는 자기 계정(eumi_app) 비밀번호만 넘긴다.
    # BE가 새 설정 키를 정하면 여기에 "이름: ${이름:?...}" 한 줄, .env.config에 값 한 줄을 추가한다.
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/eumi
      DB_USERNAME: eumi_app
      DB_PASSWORD: ${EUMI_APP_PASSWORD:?.env.config에 EUMI_APP_PASSWORD가 필요합니다}
      UPLOAD_DIR: /data/uploads
      # 메일: 지금은 같은 compose의 mailpit으로 보낸다 (밖으로 나가지 않음).
      #   실제 SMTP를 정하면 아래 4줄을 바꾸고, 계정(SMTP_USERNAME · SMTP_PASSWORD)은 .env.config로 넘긴다
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_AUTH: "false"
      SMTP_STARTTLS_ENABLED: "false"
      EUMI_MAIL_FROM: no-reply@k15b201.p.ssafy.io
      # 인증 코드 · 가입 증명 해시 키 (비밀값. 서버에서 한 번 만들고 바꾸지 않는다)
      EUMI_AUTH_HASH_KEY: ${EUMI_AUTH_HASH_KEY:?.env.config에 EUMI_AUTH_HASH_KEY가 필요합니다}
      # AI_BASE_URL: http://ai:8000            (ai 서비스를 추가할 때)
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g
    logging: *logging

  web:
    image: eumi-web:${WEB_TAG:?.env.tags에 WEB_TAG가 필요합니다}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    mem_limit: 256m
    logging: *logging

  # 임시 메일 서버: 밖으로 메일을 보내지 않고 모아 둔다. 실제 SMTP를 정하면 교체한다.
  # 메일함 화면은 인증이 없으므로 127.0.0.1에만 연다. 볼 때는 PC에서 SSH 터널:
  #   ssh -i C:/keys/eumi.pem -L 8025:127.0.0.1:8025 ubuntu@k15b201.p.ssafy.io → http://localhost:8025
  # backend는 컨테이너 사이 주소 mailpit:1025 로 보낸다 (호스트 포트 불필요).
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    mem_limit: 256m
    logging: *logging

  # ========== 데이터 파이프라인 (MinIO · Kafka · pipeline = Spark + Airflow) ==========
  # 로컬 infra/docker-compose.yml 의 data 프로필과 같은 구성. 모든 배치 · 스트리밍 스크립트는 pipeline 컨테이너 안에서 돈다.
  # 저장소 data/pipeline · data/airflow 는 sync.sh 가 /srv/eumi/data 로 복사해 마운트한다 (이미지 재빌드 없이 스크립트 · DAG 갱신).
  # 원본 파일 · 가상 유동 · 모델 자산은 MinIO 볼륨(eumi-miniodata)에 있다. 서버 구성 절차는 infra/README.md "데이터 파이프라인 서버 구성".

  # 원본 저장소 (S3 호환). 버킷 sgi. 포트를 열지 않는다 — 컨테이너 사이 주소 minio:9000 만 쓴다
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?.env.config에 MINIO_ROOT_USER가 필요합니다}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?.env.config에 MINIO_ROOT_PASSWORD가 필요합니다}
      MINIO_DEFAULT_BUCKETS: sgi
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    logging: *logging

  # 메시지 큐 (KRaft 단일 노드). 스트리밍 시연용. 컨테이너 사이 주소 kafka:19092, 보관 7일
  kafka:
    image: apache/kafka:3.9.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms512m"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 1536m
    logging: *logging

  # 토픽 flow_hourly 를 만들고 끝난다
  kafka-init:
    image: apache/kafka:3.9.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic flow_hourly --partitions 6 --replication-factor 1
    logging: *logging

  # Airflow 메타 DB 마이그레이션 + 관리자 계정 (배포마다 한 번 돌고 끝난다. 다시 실행해도 안전)
  pipeline-init:
    image: eumi-pipeline:${PIPELINE_TAG:?.env.tags에 PIPELINE_TAG가 필요합니다}
    environment: &pipeline-env
      # MinIO (S3A · s3fs). 루트 계정을 그대로 접근 키로 쓴다
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: sgi
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC_FLOW: flow_hourly
      # 결과 DB (eumi_pipeline 계정)
      PIPELINE_DB_URL: jdbc:postgresql://postgres:5432/eumi
      PIPELINE_DB_USER: eumi_pipeline
      PIPELINE_DB_PASSWORD: ${EUMI_PIPELINE_PASSWORD:?.env.config에 EUMI_PIPELINE_PASSWORD가 필요합니다}
      PIPELINE_DB_DSN: postgresql://eumi_pipeline:${EUMI_PIPELINE_PASSWORD}@postgres:5432/eumi
      # 수집 API 키 · 모델 버전
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:?.env.config에 DATA_GO_KR_SERVICE_KEY가 필요합니다}
      KAKAO_REST_KEY: ${KAKAO_REST_KEY:?.env.config에 KAKAO_REST_KEY가 필요합니다}
      MODEL_VERSION: v20261102
      TZ: Asia/Seoul
      # Airflow (메타 DB 는 postgres 의 airflow DB, 태스크는 pipeline 컨테이너 안에서 LocalExecutor 로)
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?.env.config에 AIRFLOW_DB_PASSWORD가 필요합니다}@postgres:5432/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/eumi/data/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?.env.config에 AIRFLOW_SECRET_KEY가 필요합니다}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__WEBSERVER__BASE_URL: https://k15b201.p.ssafy.io/airflow
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "true"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "60"
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    volumes: &pipeline-volumes
      - ./data:/opt/eumi/data
      - sparkcheckpoint:/opt/eumi/checkpoint
      - airflowlogs:/opt/airflow/logs
    working_dir: /opt/eumi/data
    entrypoint: ["/bin/bash", "-c"]
    command:
      - airflow db migrate && airflow users create --username "${AIRFLOW_ADMIN_USER:?.env.config에 AIRFLOW_ADMIN_USER가 필요합니다}" --password "${AIRFLOW_ADMIN_PASSWORD:?.env.config에 AIRFLOW_ADMIN_PASSWORD가 필요합니다}" --firstname Eumi --lastname Admin --role Admin --email admin@eumi.local || true
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # Airflow 스케줄러 = 월 배치 실행기. Spark 드라이버(4g) 가 이 안에서 뜬다
  pipeline:
    image: eumi-pipeline:${PIPELINE_TAG:?.env.tags에 PIPELINE_TAG가 필요합니다}
    restart: unless-stopped
    environment: *pipeline-env
    volumes: *pipeline-volumes
    working_dir: /opt/eumi/data
    command: ["airflow", "scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    depends_on:
      pipeline-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 6g
    logging: *logging

  # Airflow 웹 UI → Nginx /airflow/ (로그인 필요). 127.0.0.1 에만 연다
  pipeline-web:
    image: eumi-pipeline:${PIPELINE_TAG:?.env.tags에 PIPELINE_TAG가 필요합니다}
    restart: unless-stopped
    environment: *pipeline-env
    volumes: *pipeline-volumes
    ports:
      - "127.0.0.1:8081:8080"
    command: ["airflow", "webserver"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      pipeline-init:
        condition: service_completed_successfully
    mem_limit: 1g
    logging: *logging

  # ---------- 준비되면 추가 (D8 · D9 결정 후) ----------
  # ai:
  #   image: eumi-ai:${AI_TAG:?.env.tags에 AI_TAG가 필요합니다}
  #   restart: unless-stopped
  #   environment:
  #     DB_URL: postgresql://eumi_ai:${EUMI_AI_PASSWORD}@postgres:5432/eumi   (키 이름은 AI 담당과 맞춘다)
  #     GMS_API_KEY: ${GMS_API_KEY:?.env.config에 GMS_API_KEY가 필요합니다}
  #   mem_limit: 2g
  #   logging: *logging
  #   # ports 없음 — backend만 http://ai:8000 으로 호출

volumes:
  pgdata:
    external: true      # 04 문서에서 "docker volume create eumi-pgdata"로 직접 만든다
    name: eumi-pgdata
  uploads:
    name: eumi-uploads
  miniodata:
    external: true      # 원본 · 가상 유동 · 모델 자산. "docker volume create eumi-miniodata"로 직접 만든다 (down -v 에도 남게)
    name: eumi-miniodata
  kafkadata:
    name: eumi-kafkadata
  sparkcheckpoint:
    name: eumi-sparkcheckpoint
  airflowlogs:
    name: eumi-airflowlogs
