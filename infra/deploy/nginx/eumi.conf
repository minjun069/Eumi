# ==========================================================================
# 호스트 Nginx 최종 설정 → 서버 /etc/nginx/sites-available/eumi
#
# 원본은 저장소의 이 파일이다. 서버에는 인프라 담당이 손으로 반영한다:
#   sudo cp <이 파일> /etc/nginx/sites-available/eumi && sudo nginx -t && sudo systemctl reload nginx
# Jenkins는 이 파일을 서버에 쓰지 않고, 서버 파일과 다르면 빌드를 노란색(UNSTABLE)으로 표시만 한다.
#
# 인증서: certbot certonly --webroot 로 발급 (03 문서 5번). certbot이 이 파일을 고치지 않는다.
# 갱신: certbot.timer가 자동으로 하고, 갱신되면 deploy-hook이 nginx를 reload한다.
# ==========================================================================

# 모든 응답에서 Nginx 버전을 숨긴다 (아래 세 server 블록 모두에 적용)
server_tokens off;

# 도메인이 아닌 주소(IP 직접 접속, 모르는 Host)로 온 요청은 응답 없이 끊는다.
# 자동 스캐너는 대부분 IP로 들어온다.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

# HTTP → HTTPS (인증서 갱신 확인 경로만 예외)
server {
    listen 80;
    server_name k15b201.p.ssafy.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 기본 nginx(1.24) 문법. "http2 on;"은 1.25.1 이상에서만 쓸 수 있다.
    listen 443 ssl http2;
    server_name k15b201.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/k15b201.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k15b201.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:eumi_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- 에이전트 흐름 (SSE): 버퍼링을 꺼야 이벤트가 바로 전달된다 ----------
    # 경로는 BE가 SSE 주소를 정하면 맞춘다 (BE-FE 공통 설정 문서 6장).
    location /api/agent/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ---------- 내부 관리 경로는 밖에서 막는다 (지금은 없지만 나중에 추가돼도 안전하게) ----------
    location /api/actuator { return 404; }
    location /api/swagger-ui { return 404; }
    location /api/v3/api-docs { return 404; }

    # ---------- backend API ----------
    location /api/ {
        # backend 업로드 한도(50MB)와 맞춘다. 업로드 경로가 정해지면 그 경로만 50m로 좁힌다.
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # ---------- Jenkins (127.0.0.1:9090, --prefix=/jenkins) ----------
    location = /jenkins { return 301 /jenkins/; }
    location /jenkins/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  443;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 90s;
        client_max_body_size 50m;
    }

    # ---------- web (React 정적 파일 컨테이너) ----------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
