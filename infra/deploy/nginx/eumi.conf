# ==========================================================================
# 호스트 Nginx 최종 설정 → 서버 /etc/nginx/sites-available/eumi
#
# 원본은 저장소의 이 파일이다. 서버에는 인프라 담당이 손으로 반영한다:
#   sudo cp <이 파일> /etc/nginx/sites-available/eumi && sudo nginx -t && sudo systemctl reload nginx
# Jenkins는 이 파일을 서버에 쓰지 않고, 서버 파일과 다르면 빌드를 노란색(UNSTABLE)으로 표시만 한다.
#
# 인증서: certbot certonly --webroot 로 발급 (03 문서 5번). certbot이 이 파일을 고치지 않는다.
# 갱신: certbot.timer가 자동으로 하고, 갱신되면 deploy-hook이 nginx를 reload한다.
# ==========================================================================

# 모든 응답에서 Nginx 버전을 숨긴다 (아래 세 server 블록 모두에 적용)
server_tokens off;

# ---------- 요청 제한 (로그인 · 메일 발송 경로만, 접속 IP 기준) ----------
# map 결과가 빈 값인 요청은 세지 않는다 → 아래 POST 3개 경로만 제한되고, 1초 조회 등 나머지 API는 영향 없음
# SSAFY 망은 여러 사람이 같은 공인 IP로 나가므로 사람 손으로는 걸리지 않을 만큼 넉넉하게 둔다
map "$request_method:$uri" $eumi_login_limit_key {
    "POST:/api/auth/login"                  $binary_remote_addr;
    default                                 "";
}
map "$request_method:$uri" $eumi_mail_limit_key {
    "POST:/api/signup/email-verifications"  $binary_remote_addr;
    "POST:/api/auth/temp-password"          $binary_remote_addr;
    default                                 "";
}
limit_req_zone $eumi_login_limit_key zone=eumi_login:10m rate=10r/m;   # 로그인: 분당 10회 + 순간 10회
limit_req_zone $eumi_mail_limit_key  zone=eumi_mail:10m  rate=3r/m;    # 메일 발송: 분당 3회 + 순간 3회

# 429 응답 본문의 requestId를 계약(ResponseMeta.requestId, uuid 형식)에 맞춘다
map $request_id $eumi_request_uuid {
    "~^(?<a>.{8})(?<b>.{4})(?<c>.{4})(?<d>.{4})(?<e>.{12})$"  "$a-$b-$c-$d-$e";
}

# 도메인이 아닌 주소(IP 직접 접속, 모르는 Host)로 온 요청은 응답 없이 끊는다.
# 자동 스캐너는 대부분 IP로 들어온다.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

# HTTP → HTTPS (인증서 갱신 확인 경로만 예외)
server {
    listen 80;
    server_name k15b201.p.ssafy.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 기본 nginx(1.24) 문법. "http2 on;"은 1.25.1 이상에서만 쓸 수 있다.
    listen 443 ssl http2;
    server_name k15b201.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/k15b201.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k15b201.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:eumi_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 에이전트 패널은 11/2부터 1초 조회(A 방식)라 별도 location 없이 아래 /api/ 블록으로 처리한다 (SSE 설정 없음)

    # ---------- 내부 관리 경로는 밖에서 막는다 (지금은 없지만 나중에 추가돼도 안전하게) ----------
    location /api/actuator { return 404; }
    location /api/swagger-ui { return 404; }
    location /api/v3/api-docs { return 404; }
    # 내부 연동 API(INT-04, 계획 중인 INT-07 · 08도 같은 경로)는 compose 내부망(http://backend:8080)으로만 부른다. 밖에서 오는 요청은 막는다 (docs/api/insight-report.md 5절)
    location /api/internal/ { return 404; }

    # ---------- backend API ----------
    location /api/ {
        # backend 업로드 한도(50MB)와 맞춘다. 업로드 경로가 정해지면 그 경로만 50m로 좁힌다.
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;

        # 요청 제한: 위 map에 있는 POST 3개 경로만 센다. 초과하면 계약의 RATE_LIMITED(429) 형식으로 답한다
        # (backend가 직접 보내는 429는 그대로 통과한다: proxy_intercept_errors가 꺼져 있음)
        limit_req zone=eumi_login burst=10 nodelay;
        limit_req zone=eumi_mail  burst=3  nodelay;
        limit_req_status 429;
        error_page 429 @eumi_rate_limited;
    }

    location @eumi_rate_limited {
        default_type application/json;
        # location 안에 add_header가 있으면 server의 add_header가 상속되지 않으므로 필요한 것만 다시 단다
        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-Id $eumi_request_uuid always;
        return 429 '{"success":false,"error":{"code":"RATE_LIMITED","message":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.","fieldErrors":[]},"meta":{"requestId":"$eumi_request_uuid","timestamp":"$time_iso8601"}}';
    }

    # ---------- Jenkins (127.0.0.1:9090, --prefix=/jenkins) ----------
    location = /jenkins { return 301 /jenkins/; }
    location /jenkins/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  443;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 90s;
        client_max_body_size 50m;
    }

    # ---------- Airflow 화면 (pipeline-web 127.0.0.1:8081, base_url /airflow, 로그인 필요) ----------
    location = /airflow { return 301 /airflow/; }
    location /airflow/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }

    # ---------- Grafana (127.0.0.1:3001, root_url /grafana/, 로그인 필요) ----------
    #   Grafana가 하위 경로를 직접 처리하므로(SERVE_FROM_SUB_PATH) 경로를 바꿔 쓰지 않는다
    location = /grafana { return 301 /grafana/; }
    location /grafana/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # 화면의 실시간 갱신(웹소켓). 없어도 대시보드는 주기적으로 새로 읽는다
    location /grafana/api/live/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }

    # ---------- web (React 정적 파일 컨테이너) ----------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
