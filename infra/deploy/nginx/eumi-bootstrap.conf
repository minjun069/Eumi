# ==========================================================================
# HTTPS 인증서를 처음 발급받을 때만 쓰는 임시 설정 → 서버 /etc/nginx/sites-available/eumi
# 발급이 끝나면 eumi.conf로 교체한다 (03 문서 6번).
# ==========================================================================
server {
    listen 80;
    server_name k15b201.p.ssafy.io;

    # Let's Encrypt가 도메인 소유를 확인하러 오는 경로 (certbot --webroot가 이 폴더에 파일을 둔다)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        default_type text/plain;
        return 200 "eumi bootstrap\n";
    }
}
