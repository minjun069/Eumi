# Spark 기본 설정. infra/spark/Dockerfile 이 /opt/spark/conf/spark-defaults.conf 로 복사한다.
# spark-submit 옵션(--driver-memory 등)으로 덮어쓸 수 있다.
spark.master                                   local[*]
spark.driver.memory                            4g
spark.sql.shuffle.partitions                   16
spark.sql.session.timeZone                     Asia/Seoul
spark.sql.parquet.compression.codec            zstd

# MinIO (S3A). 자격 증명은 환경변수 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (compose가 MINIO_ACCESS_KEY · MINIO_SECRET_KEY 를 넣는다)
spark.hadoop.fs.s3a.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                   http://minio:9000
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.aws.credentials.provider   com.amazonaws.auth.EnvironmentVariableCredentialsProvider
