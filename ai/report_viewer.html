<title>이음 · Agent 실행 리포트</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--paper:#fff;--ink:#202c3c;--sub:#687587;--line:#e1e6ed;--accent:#345bd6;--soft:#edf2ff;--green:#16704f;--red:#b53640;--amber:#9a6500;--radius:14px;font-family:Inter,"Pretendard","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65}button,input,select{font:inherit}button,.file-button{cursor:pointer}button{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 13px;color:var(--ink)}button:hover,.file-button:hover{background:var(--soft)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #b5c4ff;outline-offset:2px}button.active{background:var(--ink);border-color:var(--ink);color:white}h1,h2,h3,p{margin:0}h1{font-size:28px;line-height:1.3;letter-spacing:-1px}h2{font-size:18px;letter-spacing:-.4px}h3{font-size:15px}small{font-size:12px}.muted{color:var(--sub)}.mono,pre,code{font-family:Consolas,"Cascadia Mono",monospace}.wrap{overflow-wrap:anywhere}.shell{max-width:1600px;margin:auto;display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:30px 20px;border-right:1px solid var(--line);background:var(--paper)}.brand{display:flex;gap:11px;align-items:center;font-size:17px;font-weight:700}.brand-mark{background:var(--ink);color:white;width:34px;height:34px;display:grid;place-items:center;border-radius:10px}.eyebrow{font-size:11px;letter-spacing:1.7px;font-weight:700;color:var(--sub);text-transform:uppercase}.sidebar .eyebrow{margin:34px 10px 10px}.run-list{display:grid;gap:9px;overflow-y:auto;min-height:60px}.run-button{text-align:left;display:grid;gap:8px;padding:13px;width:100%;background:transparent;border-color:transparent;border-left:3px solid transparent}.run-button.selected{background:var(--soft);border-left-color:var(--accent);color:var(--ink)}.run-top{display:flex;align-items:center;justify-content:space-between;gap:6px}.run-name{font-size:14px;font-weight:700}.run-meta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub)}.file-button{display:block;text-align:center;margin-top:26px;background:var(--ink);color:white;padding:11px;border-radius:9px;font-weight:600}.file-button:hover{color:var(--ink)}.file-button input{width:1px;height:1px;opacity:0;position:absolute}.file-button:focus-within{outline:3px solid #b5c4ff}.sidebar-foot{margin-top:auto;padding:28px 8px 0;font-size:12px;color:var(--sub)}.sidebar-foot strong{color:var(--ink);display:block;font-weight:500}.main{min-width:0;padding:32px 40px 70px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.actions{display:flex;gap:8px}.subtitle{margin-top:10px;color:var(--sub)}.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:5px;background:#eef1f5;color:#536274;padding:3px 8px;font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap}.badge.good{background:#e7f4ed;color:var(--green)}.badge.bad{background:#fbecef;color:var(--red)}.badge.warn{background:#fff3d9;color:var(--amber)}.badge.blue{background:var(--soft);color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0 15px}.stat{background:var(--paper);border:1px solid var(--line);padding:16px 19px;border-radius:var(--radius)}.stat-label{font-size:12px;color:var(--sub)}.stat-value{font-size:25px;font-weight:650;line-height:1.5;font-variant-numeric:tabular-nums;letter-spacing:-.6px}.stat-detail{font-size:11px;color:var(--sub)}.notice{padding:12px 16px;border-radius:9px;background:#edf1f6;color:#59677a;font-size:12px;margin:12px 0}.notice.error{background:#fbecef;color:var(--red);white-space:pre-wrap}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-top:28px;overflow:auto}.tab{border:0;border-radius:0;background:none;padding:13px 0;white-space:nowrap;color:var(--sub)}.tab.active{background:none;color:var(--accent);border-bottom:3px solid var(--accent);font-weight:650}.panel{padding-top:22px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.section-head p{font-size:12px;color:var(--sub);margin-top:3px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}.search{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}select{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper);color:var(--ink)}.check{display:flex;gap:7px;align-items:center;font-size:12px;white-space:nowrap;cursor:pointer}.check input{accent-color:var(--accent)}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:23px;margin-bottom:16px}.card.compact{padding:16px}.record{border:1px solid var(--line);background:var(--paper);border-radius:10px;margin-bottom:9px}.record>summary{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:14px 16px;list-style:none}.record>summary::-webkit-details-marker{display:none}.record>summary:before{content:'›';color:var(--sub);font-size:20px;line-height:25px;flex:none;width:10px;transition:transform .12s}.record[open]>summary:before{transform:rotate(90deg)}.ordinal{font-size:11px;color:#7a8798;background:#f1f4f8;border-radius:6px;padding:4px 6px;min-width:27px;text-align:center;font-variant-numeric:tabular-nums}.record-title{flex:1;min-width:0}.record-title strong{font-size:13px;font-weight:650}.record-title .reason{color:var(--sub);font-size:12px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.record[open] .reason{white-space:normal}.record.bad-record{border-left:3px solid var(--red)}.record-body{padding:0 18px 18px 55px}.record-label{font-size:11px;color:var(--sub);margin:14px 0 5px;font-weight:650}.child-block{border-left:2px solid #ced9fb;padding-left:16px;margin-top:17px}.child-label{color:var(--accent);font-size:12px;font-weight:600;margin-bottom:10px}.json-details{margin-top:10px}.json-details>summary{font-size:12px;color:var(--sub);cursor:pointer; ground:var(--ink);color:white;border-radius:8px;padding:11px 19px;z-index:5;font-size:12px;box-shadow:0 4px 20px #0002}.footer{font-size:11px;color:var(--sub);margin-top:24px}.status-dot{width:6px;height:6px;display:inline-block;background:currentColor;border-radius:50%}
@media(min-width:1400px){.main{padding-left:50px;padding-right:50px}}@media(max-width:1000px){.shell{grid-template-columns:210px minmax(0,1fr)}.main{padding:28px 24px}.stats{grid-template-columns:repeat(2,1fr)}.tabs{gap:18px}.record-body{padding-left:22px}}@media(max-width:650px){.shell{display:block}.sidebar{height:auto;position:static;padding:18px;border-right:0;border-bottom:1px solid var(--line)}.sidebar .eyebrow,.sidebar-foot{display:none}.run-list{display:flex;margin-top:17px;overflow:auto}.run-button{min-width:165px}.file-button{margin-top:15px;padding:8px}.main{padding:22px 16px 45px}h1{font-size:23px}.topline{align-items:flex-start}.topline .actions button{font-size:11px;padding:6px 9px}.stats{gap:8px}.stat{padding:13px}.stat-value{font-size:22px}.tabs{gap:17px;font-size:12px}.card{padding:17px}.record>summary{padding:12px 10px;gap:7px}.record>summary>.badge{display:none}.child-block{padding-left:8px}.kv{grid-template-columns:85px 1fr}.frame{height:540px}}@media print{.sidebar,.tabs,.toolbar,.actions,.footer,#toast{display:none}.shell{display:block}.main{padding:0}.panel{display:block!important}body{background:white}.card,.record{break-inside:avoid}.frame{height:700px}}

/* The node is the main reading unit; nested fields keep a visible parent trail. */
.trace-layout{grid-template-columns:250px minmax(0,1fr)}.trace-item{padding:14px}.trace-item strong{font-size:14px}.trace-item .muted{font-size:12px}
.trace-detail .card{padding:24px}.trace-detail h2{font-size:21px}.trace-detail .node-header h2{font-size:26px}.node-header .trace-path{font-size:13px}.node-nav{margin:16px 0 0}.node-nav button{font-size:13px}
.section-intro{color:var(--sub);font-size:13px;margin:7px 0 18px;line-height:1.8}.section-number{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--ink);color:white;font-size:13px;margin-right:10px;vertical-align:2px}.node-jumps{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.node-jumps button{font-size:13px}.node-section{scroll-margin-top:20px}.model-input-card{border-top:4px solid var(--accent)}
.readable-details{margin:10px 0;border:1px solid #dfe5ee;border-radius:9px;background:white;min-width:0}.readable-details>summary{display:flex;align-items:baseline;gap:9px;list-style:none;padding:13px 15px;font-size:15px;font-weight:650;line-height:1.6;color:#26384d;background:#f3f6fa;border-radius:8px;overflow-wrap:anywhere}.readable-details>summary::-webkit-details-marker{display:none}.readable-details>summary:before{content:'›';display:inline-block;font-size:20px;line-height:20px;transition:transform .12s;flex-shrink:0}.readable-details[open]>summary{border-radius:8px 8px 0 0;border-bottom:1px solid #dfe5ee}.readable-details[open]>summary:before{transform:rotate(90deg)}.readable-details[open]{padding-bottom:0}.detail-body{padding:16px 18px 18px;margin-left:15px;border-left:2px solid #d7e0ef;min-width:0}.detail-body .readable-details>summary{font-size:14px;background:#f8fafc}.detail-body .detail-body{margin-left:10px;padding:12px 14px}.field-key{display:inline;font:12px Consolas,monospace;color:#64748b;font-weight:400;overflow-wrap:anywhere}.field-title{min-width:0}.field-title .field-key{margin-left:7px}.facts dt .field-key{display:block;margin:2px 0 0}.readable .facts{grid-template-columns:minmax(110px,180px) minmax(0,1fr);gap:0;margin:4px 0}.facts dt,.facts dd{padding:10px 8px;border-bottom:1px solid #e9edf3}.facts dt{font-weight:600;color:#40536b;background:#f8fafc}.readable .section>h4{font-size:15px;color:#40536b}.field-help{font-size:12px;color:var(--sub);margin:0 0 12px}.state-field>summary{font-size:16px}.state-field .field-help{padding:0 0 8px;border-bottom:1px solid var(--line)}
.model-picker{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.model-picker button{text-align:left;flex:1;min-width:150px;padding:12px 14px}.model-picker button span{display:block;font-size:12px}.model-picker button.active{background:var(--soft);border-color:var(--accent);color:var(--accent)}.input-source{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;margin:12px 0}.message-input{border:1px solid #dce3ef;border-radius:10px;margin:14px 0;overflow:hidden}.message-title{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:13px 16px;background:#edf2fb;border-bottom:1px solid #dce3ef}.message-title h3{margin:0;font-size:16px}.message-title button{font-size:12px;padding:5px 10px}.message-content{padding:17px;min-width:0}.message-content>pre.exact-message{margin:0;background:#f8fafc;font-family:Consolas,"Cascadia Mono",monospace;font-size:13px;line-height:1.85;max-height:420px;border:1px solid #e8ecf3}.message-content .readable-details>summary{font-size:14px}.message-content .table-wrap{max-height:none}.message-content .field-help{margin-top:12px}.call-step{padding:15px 0 18px 18px;margin-top:20px;border-left:3px solid #c1cef0}.call-step h3{font-size:17px}.model-input-link{margin:10px 0;color:var(--accent)}.state-summary{padding:15px;background:#f8fafc;border-radius:9px;font-size:13px}.state-summary strong{display:block;font-size:15px;margin-bottom:4px}
@media(min-width:1400px){.main{padding-left:32px;padding-right:32px}.shell{max-width:1800px}}@media(max-width:1100px){.trace-layout{grid-template-columns:1fr}}@media(max-width:650px){.trace-detail .card{padding:17px}.detail-body{padding:10px;margin-left:7px}.detail-body .detail-body{margin-left:5px;padding:8px}.field-title .field-key{display:block;margin:2px 0 0}.readable .facts{grid-template-columns:110px minmax(0,1fr)}.message-content{padding:12px}}

<body>
<div class="shell">
 <aside class="sidebar">
  <div class="brand"><span class="brand-mark">이</span><span>이음 <span class="muted" style="font-weight:400">/ 실행 리포트</span></span></div>
  <p class="eyebrow">Agent runs</p><nav id="runs" class="run-list" aria-label="실행 선택"></nav>
  <label class="file-button">＋ report.json 불러오기<input id="files" type="file" accept=".json,application/json" multiple></label>
  <div class="sidebar-foot"><strong>파일 하나로 보는 실행 기록</strong>선택한 파일은 브라우저 안에서만 읽습니다.<br>외부 서비스로 전송하지 않습니다.</div>
 </aside>
 <main class="main">
  <div class="topline"><span class="eyebrow">Execution explorer</span><div class="actions"><button id="download">원본 JSON 저장</button></div></div>
  <h1 id="title">Agent 실행 리포트</h1><p id="subtitle" class="subtitle"></p>
  <div id="load-error" role="alert" class="notice error" hidden></div>
  <div id="stats" class="stats"></div><div id="run-notice"></div>
  <nav id="tabs" class="tabs" aria-label="리포트 보기">
   <button class="tab" data-view="trace" aria-pressed="false">호출 상세</button><button class="tab active" data-view="history" aria-pressed="true">실행 이력</button><button class="tab" data-view="answer" aria-pressed="false">저장된 응답 · 산출물</button><button class="tab" data-view="request" aria-pressed="false">요청 · 대화</button><button class="tab" data-view="checks" aria-pressed="false">검사 · 실행 정보</button><button class="tab" data-view="raw" aria-pressed="false">원본 JSON</button>
  </nav>
  <section id="trace" class="panel" hidden>
   <div class="section-head"><div><h2>노드별 실행 과정</h2><p id="trace-count"></p></div></div>
   <div id="trace-guide" class="trace-guide"></div><div id="schema-errors"></div>
   <div class="toolbar"><input id="trace-search" class="search" type="search" aria-label="전체 입출력 검색" placeholder="프롬프트·인자·응답 전체에서 검색"><select id="trace-kind" aria-label="노드 단계"><option value="">모든 노드</option><option value="interpret">목적 파악</option><option value="act">작업 선택·실행</option><option value="decide">진행 판단</option><option value="compose">응답 작성</option><option value="ask">추가 질문</option><option value="wait">답변 대기</option></select><label class="check"><input id="trace-errors" type="checkbox">실행 오류만 (스키마 오류 제외)</label></div>
   <div class="trace-layout"><div id="trace-list" class="trace-list" aria-label="노드 목록"></div><div id="trace-detail" class="trace-detail"></div></div>
  </section>
  <section id="history" class="panel">
   <div class="section-head"><div><h2>판단·호출·검증 이력</h2><p id="record-count"></p></div><div class="actions"><button id="expand">모두 펼치기</button><button id="collapse">모두 접기</button></div></div>
   <div class="toolbar"><input id="search" class="search" type="search" placeholder="도구명, 판단 이유, 결과 ID 검색" aria-label="실행 이력 검색"><select id="node-filter" aria-label="단계 필터"><option value="">모든 단계</option><option value="interpret">목적 파악</option><option value="act">작업 선택·실행</option><option value="decide">진행 판단</option><option value="compose">응답 작성</option><option value="ask">추가 질문</option></select><label class="check"><input id="failures" type="checkbox">처리 실패·검증 미통과만</label></div>
   <div id="timeline"></div>
  </section>
  <section id="answer" class="panel" hidden></section><section id="request" class="panel" hidden></section><section id="checks" class="panel" hidden></section><section id="raw" class="panel" hidden></section>

function recordView(r,number,depth=0){const d=el('details','record'+(recordFailed(r)?' bad-record':''));if(depth>30)return empty('중첩 깊이가 큽니다. 원본 JSON에서 확인하세요.');const queryActive=!!($('search').value||$('node-filter').value||$('failures').checked);if(queryActive && (r.output?.results||[]).some(treeHasMatch))d.open=true;const s=el('summary');s.append(el('span','ordinal',number));const title=el('div','record-title');const line=el('div','badges');line.append(el('strong','',r.action?.name||decisions[r.decision]||r.decision||'기록'),badge(nodeNames[r.node]||r.node||'노드'));if(r.output?.results)line.append(badge('하위 기록 '+flatten(r.output.results).length,'blue'));title.append(line,el('p','reason',r.reason||r.description||'판단 이유 미기록'));s.append(title,recordBadge(r));d.append(s);const body=el('div','record-body');body.append(el('p','record-label','판단 근거'),el('p','wrap',r.reason||'—'));body.append(el('p','record-label','기록 ID'),el('div','mono wrap',r.id||'—'));const linked=(currentReport()?.trace?.spans||[]).find(s=>s.kind==='node'&&(s.output?.node_update?.results||[]).some(x=>x.id===r.id));if(linked){const b=el('button','','이 기록이 속한 노드의 입력·결과 보기');b.addEventListener('click',()=>openTrace(linked.id));body.append(b);}if(r.action)body.append(jsonDetails('모델이 선택한 호출 인자',r.action.arguments,true));const output=summaryOutput(r.output);if(output)body.append(jsonDetails('반환값 · 판단 결과',output));const u=r.output?.model_usage;if(u){const usage=el('div','usage');usage.append(el('span','',u.model||'모델'),el('span','',seconds(u.elapsed_seconds)),el('span','',`입력 ${format(u.tokens?.input_tokens)} · 출력 ${format(u.tokens?.output_tokens)} 토큰`));body.append(usage);}if(r.output?.artifact){const a=el('details','json-details');a.append(el('summary','','이 호출의 산출물 미리보기'));let ready=false;a.addEventListener('toggle',()=>{if(a.open&&!ready){a.append(artifactView(r.output.artifact,0));ready=true;}});body.append(a);}if(r.output?.results){const children=el('div','child-block');children.append(el('p','child-la function renderTimeline(){const state=currentReport()?.state;if(!state)return;const all=flatten(state.results);const matched=all.filter(matches);$('record-count').textContent=`전체 ${all.length}건 · 상위 ${state.results.length}건 / 하위 ${all.length-state.results.length}건 · 검색·필터 일치 ${matched.length}건`;$('timeline').replaceChildren();state.results.forEach((r,i)=>{if(treeHasMatch(r))$('timeline').append(recordView(r,String(i+1).padStart(2,'0')));});if(!$('timeline').children.length)$('timeline').append(empty('조건에 맞는 실행 기록이 없습니다. 검색어나 필터를 바꿔 보세요.'));}

function markdown(content){const container=el('div','prose');const lines=String(content||'').split('\n');let i=0;while(i<lines.length){const line=lines[i];if(line.trim().startsWith('```')){const code=[];i++;while(i<lines.length&&!lines[i].trim().startsWith('```'))code.push(lines[i++]);container.append(el('pre','',code.join('\n')));i++;continue;}if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){const cells=s=>s.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());const head=cells(line);i+=2;const rows=[];while(i<lines.length&&lines[i].includes('|'))rows.push(cells(lines[i++]));container.append(table(head,rows,true));continue;}const heading=line.match(/^(#{1,4})\s+(.*)$/);if(heading){const n=el('h'+Math.min(heading[1].length+1,4));n.innerHTML=inline(heading[2]);container.append(n);}else if(/^\s*[-*]\s+/.test(line)){const ul=el('ul');while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){const li=el('li');li.innerHTML=inline(lines[i++].replace(/^\s*[-*]\s+/,''));ul.append(li);}container.append(ul);continue;}else if(line.trim()){const p=el('p');p.innerHTML=inline(line);container.append(p);}i++;}return container;}
function table(headers,rows,isMarkdown=false){const wrap=el('div','table-wrap'),t=el('table'),thead=el('thead'),tr=el('tr');headers.forEach(h=>tr.append(el('th','',h)));thead.append(tr);const body=el('tbody');rows.slice(0,200).forEach(row=>{const line=el('tr');row.forEach(v=>{const td=el('td');if(isMarkdown)td.innerHTML=inline(v??'');else td.textContent=v===null?'결측':typeof v==='object'?JSON.stringify(v):String(v??'');line.append(td);});body.append(line);});t.append(thead,body);wrap.append(t);if(rows.length>200)wrap.append(el('p','muted',`전체 ${rows.length}행 중 200행 표시. 전체 값은 원본 JSON에서 확인하세요.`));return wrap;}
function safeArtifactHtml(source){const doc=new DOMParser().parseFromString(String(source),'text/html');const allowed=new Set('html head body title meta style div span p h1 h2 h3 h4 h5 strong b em i ul ol li table thead tbody tfoot tr th td caption details summary br hr pre code section article header footer main svg g rect path text tspan title desc line polyline polygon circle ellipse defs clippath'.split(' '));const attrs=new Set('class id title lang dir role aria-label aria-labelledby aria-hidden scope colspan rowspan open style xmlns viewbox width height x y x1 x2 y1 y2 cx cy r rx ry d points fill stroke stroke-width opacity fill-opacity stroke-opacity font-size font-family font-weight text-anchor dominant-baseline transform clip-path preserveaspectratio'.split(' '));for(const node of [...doc.querySelectorAll('*')]){if(!allowed.has(node.localName.toLowerCase())){node.remove();continue;}for(const attr of [...node.attributes]){if(!attrs.has(attr.name.toLowerCase())||/url\s*\(|@import|expression\s*\(/i.test(attr.value))node.removeAttribute(attr.name);}if(node.localName==='style')node.textContent=node.textContent.replace(/@import[^;]*;/gi,'').replace(/url\s*\([^)]*\)/gi,'none');}const csp=doc.createElement('meta');csp.httpEquiv='Content-Security-Policy';csp.content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src 'none'; base-uri 'none'; form-action 'none'";doc.head.prepend(csp);return '<!doctype html>'+doc.documentElement.outerHTML;}
function artifactView(a,index){const c=card();const header=el('div','artifact-header');header.append(el('h3','',`${index+1}. ${({chart:'차트',table:'비교표',data:'사용 데이터',map:'지도'})[a.type]||a.type||'산출물'}`));c.append(header);if(a.data?.mime_type==='text/html'){const iframe=el('iframe','frame');iframe.title=`산출물 ${index+1} ${a.type}`;iframe.setAttribute('sandbox','');iframe.referrerPolicy='no-referrer';iframe.srcdoc=safeArtifactHtml(a.data.content);c.append(iframe);}else if(a.data?.dataset){const data=a.data.dataset,headers=(data.columns||[]).map(x=>x.name);c.append(el('p','muted wrap',`기준 시점 ${data.as_of||'미기록'} · ${data.rows?.length??0}행`));c.append(table(headers,(data.rows||[]).map(row=>headers.map(key=>row[key]))));if(a.data.spec)c.append(jsonDetails('표현 설정',a.data.spec));if(data.sources)c.append(jsonDetails('출처 · 데이터 버전',{sources:data.sources,reference:data.reference,inputs:data.inputs}));}else c.append(jsonDetails('산출물 데이터',a.data,true));return c;}

  const meta=Object.fromEntries(Object.entries(value).filter(([k])=>!['rows','as_of'].includes(k)));root.append(readableDetails('열 정의·출처·자료 버전',meta));return root;

let nodeGroups=[], schemaFailures=[], schemaSpanIds=new Set();
function traceLabel(s){return modelPhases[s.name]||nodeNames[s.name]||s.name;}
function tracePath(s){const parts=[];let p=traceIndex.get(s.parent_id),guard=0;while(p&&guard++<60){parts.unshift(traceLabel(p));p=traceIndex.get(p.parent_id);}return parts.join(' › ');}

function ownerNode(span){let p=span,guard=0;while(p&&guard++<60){if(p.kind==='node')return p;p=traceIndex.get(p.parent_id);}return null;}

function legacyGroups(records,prefix=''){
 let group=null;
 for(const r of records||[]){
  if(!group||group.node.name!==r.node){const node={id:'legacy-'+nodeGroups.length,kind:'node',name:r.node,sequence:nodeGroups.length+1,status:'success',input:{},output:{node_update:{results:[]}},legacy:true};group={node,calls:[],path:prefix,order:nodeGroups.length+1};nodeGroups.push(group);traceIndex.set(node.id,node);}
  group.node.output.node_update.results.push(r);if(r.outcome==='failure')group.node.status='error';
  if(r.output?.results){legacyGroups(r.output.results,prefix+' › '+(r.action?.name||'하위 Agent'));group=null;}

function prepareTrace(){

 if(!nodeGroups.length)legacyGroups(currentReport()?.state.results);

 if(!schemaFailures.length){box.append(el('p','muted',currentReport()?.trace?'기록된 스키마 검증 오류 없음':'호출 추적 기록이 없어 스키마 오류 유무를 확인할 수 없습니다.'));return;}
 const section=el('div','schema-box');section.append(el('strong','',`스키마 검증 오류 ${schemaFailures.length}건`),el('p','','모델 응답, 도구 입력 또는 State의 JSON·스키마 검사에서 발생한 오류입니다. 해당 호출은 노드 내부 호출 목록에서 제외하고 여기에서 따로 표시합니다.'));
 for(const s of schemaFailures){const n=ownerNode(s);section.append(contentDetails(`${n?traceLabel(n)+' · ':''}${traceLabel(s)} · ${traceKinds[s.kind]||s.kind} 경계`,()=>{const c=el('div','readable');c.append(el('p','muted',tracePath(s)),readable(s.error),s.kind==='model'?contentDetails('실패한 모델 호출의 입력 원문',()=>modelInputView(s)):readableDetails('실패한 호출에 전달한 입력',s.input),readableDetails('반환된 응답',s.output?.sdk_response?.content??s.output??s.http_response?.body),rawJsonDetails('오류 원본 JSON',s));return c;}));}
 box.append(section);
}
function renderTraceList(){
 const q=$('trace-search').value.trim().toLocaleLowerCase(),name=$('trace-kind').value,failed=$('trace-errors').checked,list=$('trace-list');list.replaceChildren();
 const matched=nodeGroups.filter(g=>(!name||name===g.node.name)&&(!failed||groupHasError(g))&&(!q||traceSearchIndex.get(g.node.id).includes(q)));
 for(const g of matched){
  const n=g.node,b=el('button','trace-item'+(n.id===selectedTrace?' selected':''));b.setAttribute('aria-pressed',String(n.id===selectedTrace));
  b.append(el('strong','',`${g.order}. ${traceLabel(n)}`),el('div','trace-path',g.path||'최상위 Agent'));
  const kinds=g.calls.reduce((a,s)=>(a[s.kind]=(a[s.kind]||0)+1,a),{});
  b.append(el('div','muted',`모델 ${kinds.model||0}회 · 도구 ${kinds.tool||0}회 · ${seconds(n.elapsed_seconds)}`));
  if(groupHasError(g))b.append(badge('실행 오류','bad'));
  const excluded=schemaFailures.filter(s=>ownerNode(s)?.id===n.id).length;if(excluded)b.append(badge(`스키마 오류 ${excluded}건 분리`,'warn'));
  b.addEventListener('click',()=>{selectedTrace=n.id;renderTraceList();renderTraceDetail();});list.append(b);
 }
 if(!matched.length)list.append(empty('조건에 맞는 노드가 없습니다.'));
}
function openTrace(id){const node=ownerNode(traceIndex.get(id));if(!node)return;selectedTrace=node.id;$('trace-search').value='';$('trace-kind').value='';$('trace-errors').checked=false;renderTraceList();renderTraceDetail();showView('trace');$('trace').scrollIntoView({block:'start',behavior:'smooth'});}
function rawText(title,value){return contentDetails(title,()=>el('pre','',value??'미기록'));}
function callSection(span,index){
 const step=el('section','call-step');const heading=el('div','step-head');heading.append(el('h3','',`${index+1}. ${traceLabel(span)}`),badge(traceKinds[span.kind]||span.kind),el('span','muted',seconds(span.elapsed_seconds)));step.append(heading);
 if(span.error)step.append(readable(span.error));
 if(span.kind==='model'){
  const result=span.output?.validated;
  if(result){if(span.name==='Verification')step.append(el('p','field-help','모델이 호출 결과의 적합성을 판단한 내용입니다. JSON·스키마 검사와 시나리오 검사는 별도로 표시합니다.'));step.append(readable(result));}else if(span.output?.sdk_response?.content)step.append(readable(span.output.sdk_response.content));
  const inputLink=el('button','model-input-link','↗ 이 모델 호출에 전달한 입력 보기');inputLink.addEventListener('click',()=>showModelInput(span.id));step.append(inputLink);
  const sdk=span.output?.sdk_response;if(sdk)step.append(readableDetails('토큰 사용량·응답 종료 사유',{...sdk.usage_metadata,finish_reason:sdk.response_metadata?.finish_reason,model:sdk.response_metadata?.model_name}));
 }else if(span.kind==='tool'){
  step.append(readableDetails('모델이 선택한 호출 인자',span.input.selected_arguments,true),readableDetails('자료 참조를 해석한 뒤 도구에 전달한 인자',span.input.resolved_arguments),readableDetails('도구 실행 결과',span.output,true));
 }else if(span.kind==='provider'){
  step.append(readableDetails('조회 조건',span.input),readableDetails('조회한 원자료',span.output));
 }else if(span.kind==='operation'){
  step.append(readable(span.input.operation),readableDetails('연산 전 데이터',span.input.data),readableDetails('연산 후 데이터',span.output?.data),readable(span.output?.counts));
 }else if(span.kind==='agent'){
  step.append(readableDetails('하위 Agent에 전달한 입력',span.input),readableDetails('하위 Agent 반환 결과',span.output));
  const children=nodeGroups.filter(g=>isAncestor(span,g.node));if(children.length){const links=el('div','links');for(const g of children){const button=el('button','',`${g.order}. ${traceLabel(g.node)}`);button.addEventListener('click',()=>openTrace(g.node.id));links.append(button);}step.append(links);}
 }else step.append(readableDetails('입력',span.input),readableDetails('결과',span.output));
 return step;
}
const stateHelp={messages:'이 노드 실행 전에 저장된 메시지입니다. 사용자 입력, 시스템 컨텍스트, Agent·도구 응답을 역할별로 표시합니다. 모델에 실제 전송한 메시지는 모델 입력 전체에서 확인할 수 있습니다.',request:'현재 처리할 요청 내용(goal)과 필수·선호·제외 조건(constraints)입니다. 요청 해석 단계에서 내용이 정리될 수 있으므로 사용자 입력 원문과 다를 수 있습니다.',results:'이 노드에 진입하기 전에 누적된 판단·도구 호출·검증 결과입니다.',response:'현재까지 만들어진 공개 응답과 연결된 산출물입니다.',execution:'실행 상태, 예산, 오류, 중단·재개 등 실행 제어 정보입니다.'};
function stateView(state,isUpdate=false){
 const root=el('div','state-fields');if(!state)return empty('이 노드의 State가 보고서에 저장되어 있지 않습니다.');
 for(const [key,value] of Object.entries(state)){const d=contentDetails(fieldLabel(key),()=>{const body=el('div');if(!isUpdate&&stateHelp[key])body.append(el('p','field-help',stateHelp[key]));body.append(readable(value,key));return body;});d.classList.add('state-field');root.append(d);}return root;
}
function exactMessage(value,spanId,index){const p=el('pre','exact-message',typeof value==='string'?value:JSON.stringify(value,null,2));p.dataset.modelSpan=spanId;p.dataset.messageIndex=String(index);return p;}
function modelInputView(span){
 const root=el('div'),request=span.http_request,body=request?.body;
 const messages=body?.messages??span.input?.messages;
 const source=el('div','input-source');source.append(badge(body?'실제 전송한 요청':'호출 직전에 저장한 입력',body?'good':'warn'),el('span','muted',`${messages?.length??0}개 메시지 · 호출 ${span.id}`));root.append(source);
 if(request)root.append(el('p','muted wrap',`${request.method||'POST'} ${request.endpoint||''}`));
 if(!messages)root.append(empty('이 모델 호출의 메시지가 기록되지 않았습니다.'));
 (messages||[]).forEach((m,i)=>{
  const role=m.role||m.type,box=el('section','message-input'),head=el('div','message-title'),content=el('div','message-content');
  head.append(el('h3','',`${i+1}. ${{system:'시스템 프롬프트 (system)',human:'모델에 전달한 입력 (human)',user:'모델에 전달한 입력 (user)',assistant:'이전 모델 응답 (assistant)',ai:'이전 모델 응답 (ai)',tool:'도구 반환 메시지 (tool)'}[role]||role}`));
  content.append(exactMessage(m.content,span.id,i));
  box.append(head,content);const extras=Object.fromEntries(Object.entries(m).filter(([k])=>!['content','role','type'].includes(k)));if(Object.keys(extras).length)box.append(readableDetails('메시지 부가 필드',extras));root.append(box);
 });
 if(body){const {messages,...settings}=body;root.append(readableDetails('모델명·응답 생성 설정',settings,true));}
 if(span.input?.response_schema)root.append(rawJsonDetails('모델 응답 스키마 JSON (response_schema)',span.input.response_schema));
 if(span.input){const {messages,instructions,response_schema,...rest}=span.input;if(Object.keys(rest).length)root.append(rawJsonDetails('메시지 구성에 사용한 입력 JSON',rest));}
 root.append(rawJsonDetails('모델 요청 전체 JSON · 메시지·설정 포함',body??span.input));return root;
}
let selectModelInput=null;
function showModelInput(id){if(selectModelInput)selectModelInput(id);$('node-model-input')?.scrollIntoView({block:'start',behavior:'smooth'});}
function nodeSection(title,number,id,description){const c=card();c.classList.add('node-section');c.id=id;const h=el('h2');h.append(el('span','section-number',number),document.createTextNode(title));c.append(h,el('p','section-intro',description));return c;}
function renderTraceDetail(){
 const panel=$('trace-detail');panel.replaceChildren();selectModelInput=null;const group=nodeGroups.find(g=>g.node.id===selectedTrace);if(!group){panel.append(empty('노드를 선택해 주세요.'));return;}
 const n=group.node,head=card(`${group.order}. ${traceLabel(n)}`);head.classList.add('node-header');head.append(el('p','trace-path',(group.path||'최상위 Agent')+' › '+n.name));
 const next=n.output?.goto;head.append(el('div','node-outcome',next?`실행기가 지정한 다음 단계: ${nodeNames[next]||valueNames[next]||next}`:n.status==='error'?'이 노드에서 실행 중단':'다음 노드 정보 미기록'));
 if(n.started_at)head.append(el('p','muted',`${seconds(n.elapsed_seconds)} · ${new Date(n.started_at).toLocaleString('ko-KR')}`));
 const state=n.input?.state;if(state?.request?.goal){const goal=el('div','state-summary');goal.append(el('strong','',requestGoalLabel),el('p','',state.request.goal),el('p','field-help','이 노드 실행 직전 State에 저장된 요청입니다.'));head.append(goal);}
 const nav=el('div','node-nav');for(const offset of [-1,1]){const other=nodeGroups[group.order-1+offset];if(other){const button=el('button','',offset<0?'← 이전 노드':'다음 노드 →');button.addEventListener('click',()=>openTrace(other.node.id));nav.append(button);}}head.append(nav);
 const jumps=el('div','node-jumps');for(const [id,label] of [['node-model-input','01 모델 입력 전체'],['node-input-state','02 입력 State'],['node-processing','03 처리·판단 결과'],['node-result','04 State 변경']]){const b=el('button','',label);b.addEventListener('click',()=>$(id).scrollIntoView({block:'start',behavior:'smooth'}));jumps.append(b);}head.append(jumps);panel.append(head);
 const inputs=nodeSection('모델 입력 전체','01','node-model-input','확인할 모델 호출을 선택하세요. 호출마다 전달된 입력이 다릅니다. 메시지는 JSON을 포함한 원문 그대로 표시합니다.');inputs.classList.add('model-input-card');
 const models=group.calls.filter(s=>s.kind==='model'),picker=el('div','model-picker'),inputBody=el('div');
 if(models.length){const buttons=[];models.forEach((s,i)=>{const b=el('button');b.append(el('strong','',`${i+1}. ${traceLabel(s)}`),el('span','',`${s.name} · ${seconds(s.elapsed_seconds)}`));b.dataset.modelId=s.id;b.addEventListener('click',()=>selectModelInput(s.id));buttons.push(b);picker.append(b);});selectModelInput=id=>{const chosen=models.find(s=>s.id===id)||models[0];buttons.forEach(b=>{const active=b.dataset.modelId===chosen.id;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});inputBody.replaceChildren(modelInputView(chosen));};inputs.append(picker,inputBody);selectModelInput(models[0].id);}
 else inputs.append(empty(n.legacy?'이 과거 보고서에는 모델 입력이 저장되지 않았습니다.':schemaSpanIds.has(n.id)?'스키마 검증에 실패한 모델 호출은 위 오류 영역에서 확인하세요.':'이 노드는 모델을 호출하지 않았습니다.'));panel.append(inputs);
 const stateCard=nodeSection('입력 State','02','node-input-state','노드 실행 직전에 저장된 State입니다. 항목을 펼치면 필드의 의미와 저장된 값을 확인할 수 있습니다.');stateCard.append(stateView(state));
 const parent=traceIndex.get(n.parent_id);if(parent?.kind==='agent'&&nodeGroups.find(g=>g.node.parent_id===parent.id)?.node.id===n.id)stateCard.append(readableDetails('이 Agent를 시작할 때 전달한 입력',parent.input));panel.append(stateCard);
 const body=nodeSection('처리·판단 결과','03','node-processing','이 노드에서 실행한 모델·도구 호출과 각 호출의 반환 결과입니다. 호출을 시작한 순서로 표시합니다.');
 if(group.calls.length)group.calls.forEach((s,i)=>body.append(callSection(s,i)));
 else if(n.legacy)body.append(readable(n.output.node_update.results,'results'));
 else body.append(el('p','muted',schemaSpanIds.has(n.id)?'스키마 검증 오류가 발생한 호출은 위의 별도 영역에 표시했습니다.':'내부 호출 기록이 없습니다.'));panel.append(body);
 const result=nodeSection('State 변경','04','node-result','State 전체가 아닌 변경 필드입니다. node_update는 노드 반환값이고, applied_update는 실행기가 기존 결과를 합치고 검사한 뒤 그래프에 전달한 값입니다.');
 if(n.output?.node_update){result.append(contentDetails('노드가 반환한 변경값 (node_update)',()=>stateView(n.output.node_update,true),true),contentDetails('실행기가 그래프에 전달한 변경 (applied_update)',()=>stateView(n.output.applied_update,true)));}
 else result.append(el('p','muted','노드에서 반환한 상태 갱신이 없습니다.'));
 if(n.error&&!schemaSpanIds.has(n.id))result.append(readable(n.error));panel.append(result);
 const technical=card();technical.classList.add('technical');technical.append(rawJsonDetails('기술 상세 · 이 노드의 원본 JSON (스키마·HTTP 원문 포함)',{node:n,calls:(currentReport()?.trace?.spans||[]).filter(s=>s.kind!=='node'&&ownerNode(s)?.id===n.id)}));panel.append(technical);
}
for(const id of ['trace-search','trace-kind','trace-errors'])$(id).addEventListener(id==='trace-search'?'input':'change',renderTraceList);
for(const tab of $('tabs').querySelectorAll('button'))tab.addEventListener('click',()=>showView(tab.dataset.view));
for(const id of ['search','node-filter','failures'])$(id).addEventListener(id==='search'?'input':'change',renderTimeline);
$('expand').addEventListener('click',()=>{$('timeline').querySelectorAll('details.record').forEach(d=>d.open=true);});
$('collapse').addEventListener('click',()=>{$('timeline').querySelectorAll('details').forEach(d=>d.open=false);});
$('download').addEventListener('click',()=>{const r=currentReport();if(!r)return;const url=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download=(r.scenario||'agent')+'-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
$('files').addEventListener('change',async event=>{const docs=[],errors=[];for(const f of event.target.files){try{if(f.size>200*1024*1024)throw Error('200MB 이하의 보고서를 선택해 주세요.');docs.push({name:f.name,value:JSON.parse((await f.text()).replace(/^\uFEFF/,''))});}catch(e){errors.push(f.name+': '+e.message);}}const result=ingest(docs);errors.push(...result.errors);$('load-error').textContent=errors.join('\n');$('load-error').hidden=!errors.length;if(result.added){render();toast(result.added+'개 보고서를 불러왔습니다.');}event.target.value='';});
try{const loaded=JSON.parse($('report-data').textContent.replace('/*__REPORT_DATA__*/',''));const result=ingest(loaded);current=0;if(reports[0]?.report.trace)activeView='trace';if(result.errors.length){$('load-error').textContent=result.errors.join('\n');$('load-error').hidden=false;}render();}catch(e){$('load-error').textContent='보고서를 읽지 못했습니다: '+e.message;$('load-error').hidden=false;render();}
</script>
