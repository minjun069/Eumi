# 운영 — 값은 모두 환경변수(서버의 .env.config)로 받는다.
# 기본값을 두지 않아서, 빠진 값이 있으면 기동 단계에서 바로 실패한다 (→ deploy.sh가 이전 버전으로 되돌림).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS_ENABLED}

server:
  servlet:
    session:
      cookie:
        secure: true

eumi:
  ai:
    mode: ${EUMI_AI_MODE}
  auth:
    hash-key: ${EUMI_AUTH_HASH_KEY}
  mail:
    from: ${EUMI_MAIL_FROM}
